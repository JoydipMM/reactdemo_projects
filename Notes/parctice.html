function add(a){
    return function(b){
        return function (c){
            return a + b + c
        };
    }
}
//console.log(add(2)(3)(4)); // 9


function addCurring(a){
    return function(b){
        if(b === undefined){
            return a;
        }
        return addCurring(a + b);
    }
}
//console.log(addCurring(2)(3)(5)(10)()); // 20


function addArrayCurring(...a){
    return function(...b){
        if(b?.length === 0){
            return a?.[0] || 0; // if the array index 0 is undefined then return 0
        }
        return addCurring(a.reduce((acc,curnt)=>(acc+curnt),0) + b.reduce((acc,curnt)=>(acc+curnt),0)); // now a and b are array then we need to get total value of array. So we use reduce
    }
}
