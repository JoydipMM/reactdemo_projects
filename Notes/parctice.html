function addCurring(a){
    return function(b){
        if(b === undefined){
            return a;
        }
        return addCurring(a + b);
    }
}
//console.log(addCurring(2)(3)(5)(10)()); // 20


function addArrayCurring(...a){
    return function(...b){
        if(b?.length === 0){
            return a?.[0] || 0; // if the array index 0 is undefined then return 0
        }
        return addCurring(a.reduce((acc,curnt)=>(acc+curnt),0) + b.reduce((acc,curnt)=>(acc+curnt),0)); // now a and b are array then we need to get total value of array. So we use reduce
    }
}

/*
async and await are features introduced in ES2017 (ES8) that make asynchronous code easier to read and write. They are built on top of Promises, allowing asynchronous code to look like synchronous code.
*/
/*
By property of async function it always returns a promise.
If we return a promise in async function, that is okey. But if we return any string or value then async function automatically wrap that value/string into a promise and then return that promise.
So we can use await keyword to wait for the promise to be resolved and then get the resolved value. It's mean to get data from promise in async function we use await keyword.


What is async?
The async keyword is placed before a function declaration to indicate that the function always returns a Promise.

What is await?
The await keyword suspands the execution of an async function until a Promise is settled (resolved or rejected).
**/

// Javascript code execution flow difference between async/await and promise chaining
// -----------------------------------------------------------------

// a common promise function
const commonPromise = new Promise((resolve, reject)=>{
    setTimeout(()=>{
        resolve("common promise resolved after 5 seconds");
    }, 5000)
})
const commonPromise2 = new Promise((resolve, reject)=>{
    setTimeout(()=>{
        resolve("common promise resolved after 3 seconds");
    }, 10000)
})

// Promise chaining
function promiseChainingFn(){
    commonPromise.then((data)=> console.log(data));
    console.log("promiseChainingFn run completed");
}
//promiseChainingFn();
/*
Result:
promiseChainingFn run completed
common promise resolved after 5 seconds
*/

/*
We we try to get data from promise using promise chaining, the code execution flow is not blocked. So the console.log("promiseChainingFn run completed") line will be executed first and then after 5 seconds the promise will be resolved and then we get the data from promise.
*/

async function asyncAwaitFn(){
    const data = await commonPromise;
    console.log(data);
    console.log("asyncAwaitFn run completed");

    const data2 = await commonPromise2;
    console.log(data2);
    console.log("asyncAwaitFn 2 run completed");
}

//asyncAwaitFn();
/*
Result:
common promise resolved after 5 seconds
asyncAwaitFn run completed
*/

/*
But when we try to get data from promise using async/await, the code execution flow is blocked until the promise is resolved. So the console.log(data) line will be executed first and then after 5 seconds the promise will be resolved and then we get the data from promise. After that the console.log("asyncAwaitFn run completed") line will be executed.
*/



async function callAPI(){
    const response = await fetch("https://jsonplaceholder.typicode.com/posts");
    console.log(response);
    const data = await response.json();
    console.log(data);
}
//callAPI();
/*
How fetch() method works:
-----------------------------------------------
When we call fetch() method, it returns a promise. When the promise is resolved, it returns a response object. Inside the response object we get body which is a reable stream, json, status, statusText, headers, etc. But we can not get the data directly from the response object. We have to use json() method to get the data from the response object. This json() method also returns a promise. So we have to use await keyword to wait for the promise to be resolved and then get the data from the response object.

*/
/*
Response {type: 'cors', url: 'https://jsonplaceholder.typicode.com/postsx', redirected: false, status: 404, ok: false, …}
body: (...)
bodyUsed: true
headers: 
Headers {}
ok: false
redirected: false
status: 404
statusText: ""
type: "cors"
url: "https://jsonplaceholder.typicode.com/postsx"
...
*/

// Error handling in async/await
// -----------------------------------------------------------------
async function callAPIwithErrorHandling(){
    try {
        const response = await fetch("https://jsonplaceholder.typicode.com/postsx");
        console.log(response);
        const data = await response.json();
        console.log(data);
    } catch (error) {
        console.error("Error fetching API:", error);
    }
}
