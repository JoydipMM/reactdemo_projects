<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>::</title>
  <link rel="stylesheet" type="text/css" href="assets/css/custom.css">
  <!-- Custom Css Close -->
</head>

<body>

  <!-- start -->
  <div class="solution_card_boxes_main_wrap">

    <div class="solution_card_boxes_wrap desktop-view">
      <div class="solution_card_box active">
        <img src="assets/cards/card-1.png" alt="" />
      </div>
      <div class="solution_card_box">
        <img src="assets/cards/card-3.png" alt="" />
      </div>
      <div class="solution_card_box">
        <img src="assets/cards/card-2.png" alt="" />
      </div>
    </div>

    <div class="solution_card_boxes_nav_row">
      <button id="prevBtn" class="solutiondesk-slider-arrow-btn prev">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="29" viewBox="0 0 28 29" fill="none">
          <path d="M14.333 2L1.33301 14.5L14.333 27" stroke="black" stroke-width="2.66667" stroke-linecap="round"
            stroke-linejoin="round" />
          <path d="M26.333 14H1.33301" stroke="black" stroke-width="2.66667" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
      </button>
      <ul class="solution_card_nav_dot_list">
        <li class="active"><span></span></li>
        <li><span></span></li>
        <li><span></span></li>
      </ul>
      <button id="nextBtn" class="solutiondesk-slider-arrow-btn next">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="29" viewBox="0 0 28 29" fill="none">
          <path d="M13.6663 27L26.6663 14.5L13.6663 2" stroke="#1A2024" stroke-width="2.66667" stroke-linecap="round"
            stroke-linejoin="round" />
          <path d="M1.66632 15H26.6663" stroke="#1A2024" stroke-width="2.66667" stroke-linecap="round"
            stroke-linejoin="round" />
        </svg>
      </button>
    </div>

  </div>
  <!-- closed -->



  <!-- Script Open -->
  <script src="assets/js/jquery-3.6.4.min.js"></script>
  <script>

    function suffleCards() {
      const cards = document.querySelectorAll('.desktop-view .solution_card_box');
      const dots = document.querySelectorAll('.solution_card_nav_dot_list li');
      if (cards.length > 0) {
        let activeIndex = 0;

        function updateClasses() {
          cards.forEach(card => card.className = 'solution_card_box'); // reset all
          dots.forEach(dot => dot.classList.remove('active'));

          const prevIndex = (activeIndex - 1 + cards.length) % cards.length;
          const nextIndex = (activeIndex + 1) % cards.length;

          cards[activeIndex].classList.add('active');
          cards[nextIndex].classList.add('right-bottom');
          cards[prevIndex].classList.add('right-top');
          if (dots[activeIndex]) {
            dots[activeIndex].classList.add('active');
          }
        }

        document.getElementById('nextBtn').addEventListener('click', () => {
          activeIndex = (activeIndex + 1) % cards.length;
          updateClasses();
        });

        document.getElementById('prevBtn').addEventListener('click', () => {
          activeIndex = (activeIndex - 1 + cards.length) % cards.length;
          updateClasses();
        });

        cards.forEach((card, i) => {
          card.addEventListener('click', () => {
            activeIndex = i;
            updateClasses();
          });
        });

        dots.forEach((dot, i) => {
          dot.addEventListener('click', () => {
            activeIndex = i;
            updateClasses();
          });
        });

        // init
        updateClasses();
      }
    }


    suffleCards();
  </script>
  <!-- Script Close -->
</body>

</html>
