<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>::</title>
  <link rel="stylesheet" type="text/css" href="assets/css/custom.css">
  <!-- Custom Css Close -->
</head>

<body>
  <br />
  <br />
  <br />

  <!-- start -->
  <div class="slide_cardes_main_wrap">

    <div class="slide_cardes_wrap desktop-view">
      <div class="slide_card active">
        <img src="assets/images/cards/card-1.png" alt="" />
      </div>
      <div class="slide_card">
        <img src="assets/images/cards/card-3.png" alt="" />
      </div>
      <div class="slide_card">
        <img src="assets/images/cards/card-2.png" alt="" />
      </div>
    </div>

    <div class="slide_cardes_nav_row">
      <button id="prevBtn" class="solutiondesk-slider-arrow-btn prev">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="29" viewBox="0 0 28 29" fill="none">
          <path d="M14.333 2L1.33301 14.5L14.333 27" stroke="black" stroke-width="2.66667" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M26.333 14H1.33301" stroke="black" stroke-width="2.66667" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <ul class="solution_card_nav_dot_list">
        <li class="active"><span></span></li>
        <li><span></span></li>
        <li><span></span></li>
      </ul>
      <button id="nextBtn" class="solutiondesk-slider-arrow-btn next">
        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="29" viewBox="0 0 28 29" fill="none">
          <path d="M13.6663 27L26.6663 14.5L13.6663 2" stroke="#1A2024" stroke-width="2.66667" stroke-linecap="round" stroke-linejoin="round" />
          <path d="M1.66632 15H26.6663" stroke="#1A2024" stroke-width="2.66667" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    </div>

  </div>
  <!-- closed -->

  <br />
  <br />
  <br />
  <br />
  <br />
  <br />
  <br />
  <br />
  <br />

  <!-- Script Open -->
  <script src="assets/js/jquery-3.6.4.min.js"></script>
  <script>
    /* suffle card script start */
    function suffleCards() {
      const cards = document.querySelectorAll('.desktop-view .slide_card');
      const dots = document.querySelectorAll('.solution_card_nav_dot_list li');
      const navRow = document.querySelector('.slide_cardes_nav_row');
      if (cards.length > 0) {
        let activeIndex = 0;
        let autoSlideTimer = null;
        let jumpTimer = null;
        const slideAnimationDuration = 1550;

        function updateClasses(direction = 'next', animate = true) {
          cards.forEach(card => card.className = 'slide_card'); // reset all
          dots.forEach(dot => dot.classList.remove('active'));

          const prevIndex = (activeIndex - 1 + cards.length) % cards.length;
          const nextIndex = (activeIndex + 1) % cards.length;

          cards[activeIndex].classList.add('active');
          if (animate && direction === 'next') {
            cards[activeIndex].classList.add('slide-in-left');
          } else if (animate && direction === 'prev') {
            cards[activeIndex].classList.add('slide-in-right');
          }
          cards[nextIndex].classList.add('right-bottom');
          cards[prevIndex].classList.add('right-top');
          if (dots[activeIndex]) {
            dots[activeIndex].classList.add('active');
          }
        }

        function stepSlide(direction = 'next') {
          activeIndex = direction === 'prev'
            ? (activeIndex - 1 + cards.length) % cards.length
            : (activeIndex + 1) % cards.length;
          updateClasses(direction);
        }

        function stopDotJumpAnimation() {
          clearTimeout(jumpTimer);
          jumpTimer = null;
        }

        function goToSlide(targetIndex) {
          stopDotJumpAnimation();
          if (targetIndex === activeIndex) {
            updateClasses('next', false);
            return;
          }

          const direction = targetIndex > activeIndex ? 'next' : 'prev';

          function animateNextStep() {
            if (activeIndex === targetIndex) {
              jumpTimer = null;
              return;
            }

            stepSlide(direction);
            jumpTimer = setTimeout(animateNextStep, slideAnimationDuration);
          }

          animateNextStep();
        }

        function stopAutoSlideAnimation() {
          clearInterval(autoSlideTimer);
          autoSlideTimer = null;
        }

        function autoSlideAnimation() {
          stopAutoSlideAnimation();
          autoSlideTimer = setInterval(() => {
            stepSlide('next');
          }, 4000);
        }

        document.getElementById('nextBtn').addEventListener('click', () => {
          stopDotJumpAnimation();
          stepSlide('next');
        });

        document.getElementById('prevBtn').addEventListener('click', () => {
          stopDotJumpAnimation();
          stepSlide('prev');
        });

        cards.forEach((card, i) => {
          card.addEventListener('click', () => {
            goToSlide(i);
          });
        });

        dots.forEach((dot, i) => {
          dot.addEventListener('click', () => {
            goToSlide(i);
          });
        });

        if (navRow) {
          navRow.addEventListener('mouseenter', stopAutoSlideAnimation);
          navRow.addEventListener('mouseleave', autoSlideAnimation);
        }

        // init
        updateClasses('next', false);
        autoSlideAnimation();
      }
    }


    suffleCards();
    /* suffle card script ended */
  </script>
  <!-- Script Close -->
</body>

</html>
