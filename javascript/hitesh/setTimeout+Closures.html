    inside setTimeout() function: there is a callback function, which is a function like closure. When a closure forms, a closure is like fuction along with its laxical environment. which can rememeber the variables of the parent / laxical environment. Also variables inside closure are reference type variables. which means they are pointing to the same memory address. So when this closure function stored to another memory space by setTimeout function, this closure still remembers the variables referenced by its laxical environment. When the for loop runs first time, it makes the copy of the callback function and attached to the timer. When the for loop runs second time, it makes the copy of the callback function and attached to the timer. So the closure function still has access to the variables reference by its laxical environment. It will do the same thing until the for loop runs 5 times.

    Now JavaScript dose not wait for anything. Mean while when the timer expires, it is too late and the value of i is 6, because the loop has already run 5 times and when the callback function runs by that time the value of i is 6. thats why it prints 6 6 6 6 6. All this happens because of variable type is "var".

    So the solution is to use "let" variable type. With let variable type, "let" is a block scoop. So when every time the for loop runs, it makes a new copy of i all together, also it makes a new copy of the callback function. This is why the result is 1 2 3 4 5

    The solution with variable type "var" is that every time the for loop runs, Some how we have to give a copy of "i" every loop with a forms of closure with it. So the solution is to use closure. Means we enclose the setTimeout function inside another function with i parameter.

    */

    function c(){
        for(let i=1; i<=5; i++){
            function close(x){
                setTimeout(()=>{
                    console.log(x);
                    return x;
                }, x*1000)
            }
            close(i);
        }

Deep about event listeners ---------------------------------
-- first make a button with id. <button id="clickme">click me</button>
-- add event listener to the button. button.addEventListener("click", function(){}); here "click" is the event is a firt parameter. the callback function is the second parameter.

*/
document.getElementById("clickme").addEventListener("click", function(){
     console.log("clicked");
});

/*
closure demo with event listeners ---------------------------------
-- first create a closure which count the number of times the button is clicked.
-- we can access the count variable inside the callback function as a closure. Then when we click on the button, it will print the count variable.
*/
function eventCounter(){
    let count = 0;
    document.getElementById("clickme_with_Closure").addEventListener("click", function clickCallback(){
        count++;
        console.log(count);
    });
};
eventCounter();
/*
When we click on the button, addEventListener will call the clickCallback callback function which formed a closure function which can access the count variable from its outer scope/ parent scope/ lexical environment. This closure function put into call-stack and executed. As a result it print the count variable (to view this process we need to add a debugger in our devtool in source tab).
