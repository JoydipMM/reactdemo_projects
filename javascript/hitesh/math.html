<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        body{
            background-color: #212121;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
        }   
    </style>

    <script>
        //remainder oparetor
        console.log(13%2) // 1 // remainder 1
        console.log(14%2) // 0 // remainder 0

        //exponential oparetor
        console.log(2**3) // 8 // First digit is base and second digit is power, means first digit multiply with second digit and so on
        
        // Math PI
        console.log(Math.PI); // 3.141592653589793
        console.log(Math.sqrt(16)); // 4 // square root of 16 is 4
        console.log(Math.sqrt(25)); // 5 // square root of 25 is 5

        // Math pow vs **
        console.log(Math.pow(2,3) ) // 8 // First digit is base and second digit is power, means first digit multiply with second digit and so on.
        console.log(2**3) // 8 both are same but above one is more accurate. this one introduce in es6
        
        // Math.floor() method rounds a number down to the nearest integer.
        console.log(Math.floor(2.9)); // 2 // round down
        console.log(Math.floor(2.1)); // 2 // round down
        console.log(Math.floor(2.4)); // 2 // round down
        console.log(Math.floor(-2.4)); // -3 // round down
        console.log(2.9999999999999999) // 3 // round up.

        // Math.ceil() method rounds a number up to the nearest integer.
        console.log(Math.ceil(2.9)); // 3 // round up
        console.log(Math.ceil(2.1)); // 3 // round up
        console.log(Math.ceil(2.4)); // 3 // round up
        console.log(Math.ceil(-2.4)); // -2 // round up

        // Math.round() method rounds a number to the nearest integer.
        console.log(Math.round(2.9)); // 3 // round up
        console.log(Math.round(2.1)); // 2 // round down
        console.log(Math.round(2.4)); // 2 // round down
        console.log(Math.round(2.49)); // 2 // round down
        console.log(Math.round(2.55)); // 3 // round up
        console.log(Math.round(-2.4)); // -2 // round down
        console.log(Math.round(-2.6)); // -3 // round down

        // Math.random() method returns a random number between 0 (inclusive), and 1 (exclusive).
        console.log(Math.random()); // random number between 0 to 1, but not 1. like 0.999999999999999
        console.log(Math.random() + 1); // random number 1 to 2, but not 2. like 1.999999999999999
        console.log(Math.random() * 10); // random number between 0 to 9
        console.log(Math.floor(Math.random() * 10) + 1); // random number between 1 to 10

        // Math.random() between 10 to 20
        console.log(Math.floor(Math.random() * 10) + 10); // random number between 10 to 19
        console.log(Math.floor(Math.random() * 10) + 11); // random number between 10 to 20
        console.log(Math.floor(Math.random() * 21)); // random number between 0 to 20

        // infinity
        console.log(1/0); // Infinity
        console.log(-1/0); // -Infinity

        // NaN
        console.log(0/0); // NaN

        const number = prompt("Enter a number");
        console.log(typeof(Number(number)));
        
    </script>
</body>
</html>
