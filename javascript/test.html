<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 100px; height: 100px; background-color: rosybrown; margin: 10px; display: inline-block; transition: all ease-in-out 1s;
        }
    </style>
</head>
<body>
<!-- <input type="text" class="text_input" value="" name="username" />   -->
<button id="btn01">Click</button>
<div class="forloop_data"></div>

<!-- <div class="box"></div>
<div class="box"></div>
<div class="box"></div>
<div class="box"></div> -->

<script>
    const conatiner = document.querySelector(".forloop_data");
    const button = document.querySelector("#btn01");

    button.addEventListener("click", function(){
        loadElements();
    });


    function loadElements(){
        for(let i = 0; i < 10; i++){
            setTimeout(()=>{
                let box = `<div class="box">${i+1}</div>`;
                conatiner.innerHTML += box;
            }, i * 100)
        }
    }
    

</script>
</body>
</html>
