<h2>01-linear search</h2>
<p>Linear Search is the simplest searching algorithm. It checks each element one by one until it finds the target value.</p>

<textarea id="editor">
arr = [2, 3, 4, 5, 0, 6, 7, 8, 9, 10];
function linearSearch(arr, target){
    for(let i = 0; i < arr.length; i++){
        if(arr[i] == target){
            console.log(i)
            return `index of ${target} is ${i}`
        }
    }
    return -1
}
console.log(linearSearch(arr, 4));
// result: index of 0 is 4
console.log(linearSearch(arr, 20));
// result: -1
</textarea>


<script>

        }
    }
    return -1
}
console.log(linearSearch(arr, 4));
// result: index of 0 is 4
console.log(linearSearch(arr, 20));
// result: -1
</script>
