<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Filter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>



    <div class="container text-center">

        <div id="search-container">
            <div class="row mt-4 mb-4">
                <div class="col-8">
                    <input class="form-control" type="search" id="search-input" placeholder="Search product name here.." />
                </div>
                <div class="col-auto">
                    <button class="btn btn-block btn-secondary" id="search" onclick="search()">Search</button>
                </div>
            </div>
        </div>

        <div id="filter_buttons">
            <button class="btn btn-secondary button-value" onclick="filterProduct('all')">All</button>
            <button class="btn btn-secondary button-value" onclick="filterProduct('Topwear')">Topwear</button>
            <button class="btn btn-secondary button-value" onclick="filterProduct('Bottomwear')">Bottomwear</button>
            <button class="btn btn-secondary button-value" onclick="filterProduct('Jacket')">Jacket</button>
            <button class="btn btn-secondary button-value" onclick="filterProduct('Watch')">Watch</button>
        </div>



        <div class="row justify-content-start mt-4" id="products_row">

            <!-- <div class="col-3">
                <div class="card mb-4">
                    <div class="card-img-box">
                        <img src="images/black-leather-jacket.jpg" class="card-img-top" alt="product">
                    </div>
                    <div class="card-body">
                        <h5 class="card-title">Card title</h5>
                        <p class="card-text">Some quick example text to build on the card title and make up the bulk of the card's content.</p>
                        <a href="#" class="btn btn-primary">Go somewhere</a>
                    </div>
                </div>
            </div> -->

        </div>
    </div>
    <script src="script.js"></script>   
</body>
</html>
