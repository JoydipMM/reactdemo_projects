<h2>Includes</h2>
<p>Includes: it will find any item from array, result will be show in True/False. It is case sensetive</p>
<xmp style="margin-top: -25px;">
    var b = a.includes("Sanjay");
</xmp>
<p>Result:</p>
<script>
var a = ["Sanjay", "Aman", "Raman", "Karan", "Aman","Sanjay",];
document.write("Actual Array: "+ a + "<br>");
var b = a.includes("Sanjay");
document.write("inclues Data: "+ b + "<br>");

</script>
