<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Call</title>
    <style>
    *{ margin: 0; padding: 0; box-sizing: border-box; }
    body{ background-color: #000000; color: #854101; font-family: "arial"; font-size:14px; }
    section{ width: 100%; display: inline-block; position: relative; padding: 40px 0px; }
    .conatiner{ width: 100%; max-width: 1500px; margin: 0 auto; }
    .item-grid{ display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
    .item-box{ width: 100%; border: 1px solid #fff; padding: 10px; border-radius: 20px; position: relative; background-color: #fff; border: #a3a3a3 solid 1px; }
    .item-box .img_frame{ width: 100%; height: 250px; border-radius: 20px; overflow: hidden; display: inline-block; position: relative; }
    .item-box .img_frame img{ width: 100%; height: 100%; object-fit: cover; }
    .item-box .content_wrap{ width: 100%; min-height: 60px; position: relative; padding: 10px 15px; display: flex; flex-direction: column; row-gap: 10px; }
    
    .item-box.rowview{ display: flex; column-gap: 20px; margin-bottom: 15px; }
    .item-box.rowview .img_frame{ width: 100px; height: 100px; flex-shrink: 0; border-radius: 5px; }
    
    .cart_bucket{ width: auto; height: 40px; display: inline-flex; align-items: center; justify-content: center; position: fixed; z-index: 1; top: 50px; right: 50px; background: #fff; padding: 10px 10px; border-radius: 50px; cursor: pointer; }
    .cart_overlay_box{ width:400px; height: 100%; background: #fff; z-index: 991; position: fixed; top: 0; right: -100%; padding:40px 20px 20px 20px; overflow-y: scroll; border-radius: 20px 0px 0px 20px; transition: all ease-in-out 0.5s; }
    .cart_overlay_box.expanded{ right: 0; }
    .close_btn{ width: 30px; height: 30px; position: absolute; top: 10px; right: 10px; cursor: pointer; }
    </style>
</head>
<body>

<section>
    <div class="cart_overlay_box">
        <span class="close_btn" onclick="expandBucketEvent()">Close</span>
        <div class="show_cart_item"></div>
        <div class="total_price_row">Total: <span class="total_price"></span></div>
    </div>
    <div class="cart_bucket" onclick="expandBucketEvent()">Cart: <span class="cartCount"></span></div>



    <div class="conatiner">
        <div class="recipe_detail"></div>
    </div>
    

</section>



<script>
let cartItems = [];
const recipeWrap = document.querySelector(".recipe_detail");
const cartCount = document.querySelector(".cartCount");
const cartitemshow = document.querySelector(".show_cart_item");
const totalprice = document.querySelector(".total_price");

const params = new URLSearchParams(window.location.search);
const recipeId = params.get("id");
console.log(params);
console.log(recipeId);


function saveCartToLocalStorage(){
    localStorage.setItem("cartItems", JSON.stringify(cartItems));
}

function loadCartFromLocalStorage(){
    const storedCart = localStorage.getItem("cartItems");
    if(storedCart){
        cartItems = JSON.parse(storedCart);
    }
    totalPrice();
}

async function fetchData(){
    const response = await fetch(`https://dummyjson.com/recipes/${recipeId}`);
    const data = await response.json();
    console.log("data ",data);
    return data;
}

async function showData(){
    const data = await fetchData();
    console.log(data);
        recipeWrap.innerHTML = `
        <div class="item-box">
            <div class="img_frame"><img src="${data.image}" alt=""></div>
            <div class="content_wrap">
                <h3>${data.name}</h3>
                <p>Rating: ${data.rating}</p>
                <h2>Rs: ${data.caloriesPerServing}</h2>
                <ul>
                    ${data.ingredients.map((i)=>`<li>${i}</li>`)}
                </ul>
                <button onclick="addToCart(${data.id})">Add to Cart</button>
            </div>
        </div>
        `
   
    showCartItems();
}

function totalPrice(){
    const total = cartItems.reduce((sum, item)=> { 
        return sum+item.caloriesPerServing
    }, 0);
    totalprice.innerHTML = total;
}

async function addToCart(id){
    console.log(cartItems);
    const data = await fetchData();
    //const getItem = data.find((item)=>item.id === id);
    //console.log(getItem);
    cartItems.push(data);
    saveCartToLocalStorage();
    bucket();
    showCartItems();
    totalPrice();
}

async function removeFromCart(id){
    const getItem = cartItems.find((item)=>item.id === id);
    const index = cartItems.indexOf(getItem);
    cartItems.splice(index, 1);
    saveCartToLocalStorage();
    bucket();
    showCartItems();
    totalPrice();
}


function bucket(){
    if(cartItems.length <=0){
        cartCount.innerHTML = "Empty";
    }else{
        cartCount.innerHTML = cartItems.length;
    }
}  



function expandBucketEvent(){
    const bucket = document.querySelector(".cart_overlay_box");
    bucket.classList.toggle("expanded");
}


function showCartItems(){
    cartitemshow.innerHTML = "";
    cartItems.forEach(item => {
        cartitemshow.innerHTML += `
        <div class="item-box rowview">
            <div class="img_frame"><img src="${item.image}" alt=""></div>
            <div class="content_wrap">
                <h3>${item.name}</h3>
                <h2>Rs: ${item.caloriesPerServing}</h2>
                <button onclick="removeFromCart(${item.id})" style="color:red">Remove</button>
            </div>
        </div>
        `
    });
}



loadCartFromLocalStorage();
bucket();
showData();




</script>
    
</body>
</html>
