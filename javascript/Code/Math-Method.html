<script>
var number = 5.2;
document.write("The Math.ceil() function rounds a number up to the nearest integer(in decemal number).<br>");
document.write("Actual Data >>>> "+number+"<br>")
var num = Math.ceil(5.2);
document.write("Math.ceil(5.2) >>> "+num+"<br><br>");

console.log(Math.ceil(4.1));   // 5
console.log(Math.ceil(4.9));   // 5
console.log(Math.ceil(4.0));   // 4 (already an integer)
console.log(Math.ceil(-4.1));  // -4 (rounds up, so moves toward zero)
console.log(Math.ceil(-4.9));  // -4
console.log(Math.ceil(0));     // 0

let totalItems = 23;
let itemsPerPage = 5;
let totalPages = Math.ceil(totalItems / itemsPerPage);
console.log(totalPages); // 5



var number = 5.2;
document.write("The Math.floor() method rounds a number down to the nearest integer.<br>");
document.write("Actual Data >>>> "+number+"<br>")
var num = Math.floor(5.2);
document.write("Math.floor(5.2) >>> "+num+"<br><br>");

console.log(Math.floor(4.9));   // 4
console.log(Math.floor(4.1));   // 4
console.log(Math.floor(4.0));   // 4 (already an integer)
console.log(Math.floor(-4.1));  // -5 (rounds down, away from zero)
console.log(Math.floor(-4.9));  // -5
console.log(Math.floor(0));     // 0

let totalPeople = 17;
let teamSize = 4;
let fullTeams = Math.floor(totalPeople / teamSize);
console.log(fullTeams); // 4 (even though there's a remainder, only 4 full teams


var number = 5.2;
document.write("The Math.round() method rounds a number to the nearest integer.<br>");
document.write("Actual Data >>>> "+number+"<br>")
var num = Math.max(10, 20, 30);
document.write("Math.round(5.2) >>> "+num+"<br>");
var num = Math.round(5.67);
document.write("Math.round(5.67) >>> "+num+"<br><br>");

console.log(Math.round(4.9));  // 5 (rounded up)
console.log(Math.round(4.5));  // 5 (rounded up)
console.log(Math.round(4.4));  // 4 (rounded down)
console.log(Math.round(4.0));  // 4 (already an integer)
console.log(Math.round(-4.5)); // -4 (rounds away from zero)
console.log(Math.round(-4.6)); // -5 (rounded down)
console.log(Math.round(-4.4)); // -4 (rounded up)

let price = 9.49;
console.log(Math.round(price)); // 9

let totalCost = 4.6 + 3.2;
console.log(Math.round(totalCost)); // 8


var number = 5.2;
document.write("The Math.trunc() method removes the decimal part of a number and returns only the integer portion. It does not round—it simply truncates the number.<br>");
document.write("Actual Data >>>> "+number+"<br>")
var num = Math.trunc(5.2);
document.write("Math.trunc(5.2) >>> "+num+"<br>");
var num = Math.trunc(-5.67);
document.write("Math.trunc(-5.67) >>> "+num+"<br><br>");


document.write(`The Math.max() function returns the largest number from a set of given numbers. 
<br>Math.max(num1, num2, ..., numN) 
<br>Returns -Infinity if no arguments are provided.<br>`);
var num = Math.max(10, 20, 30); // 30
document.write("Math.max(10, 20, 30) >>> "+num+"<br>");
var num = Math.max(); // -Infinity (no arguments)
document.write("Math.max() >>> "+num+"<br>");
var num = Math.max(-10, -5, -20); // -5 (least negative number)
document.write("Math.max(-10, -5, -20) >>> "+num+"<br><br>");


document.write(`The Math.min() function returns the smallest number from a given set of numbers.<br>`);
var num = Math.min(10, 20, 30); // 10
document.write("Math.min(10, 20, 30) >>> "+num+"<br>");
var num = Math.min(); // Infinity (no arguments)
document.write("Math.min() >>> "+num+"<br>");
var num = Math.min(-10, -5, -20); // -20 (most negative number)
document.write("Math.min(-10, -5, -20) >>> "+num+"<br><br>");


document.write(`The Math.pow() function raises a number to the power of another number (exponentiation).<br>Math.pow(base, exponent)<br>`);
var num = Math.pow(2, 3); // 8  (2³ = 2 * 2 * 2)
document.write("Math.pow(2, 3) >>> "+num+"<br>");
var num = Math.pow(5, 2);  // 25 (5² = 5 * 5)
document.write("Math.pow(5, 2) >>> "+num+"<br>");
var num = Math.pow(10, 0);  // 1  (Any number to the power of 0 is 1)
document.write("Math.pow(10, 0) >>> "+num+"<br>");
var num = Math.pow(8, 1/3);  // 2  (Cube root of 8)
document.write("Math.pow(8, 1/3) >>> "+num+"<br>");
var num = Math.pow(-3, 3);  // -27 (-3 * -3 * -3)
document.write("Math.pow(-3, 3) >>> "+num+"<br>");

var num = Math.pow(2, -2); // 0.25 (1 / 2² = 1/4)
document.write("Math.pow(2, -2) >>> "+num+"<br><br>");



document.write(`The Math.random() function returns a random floating-point number between 0 (inclusive) and 1 (exclusive).<br>`);
var num = Math.random(); 
document.write("Math.random() >>> "+Math.random()+"<br>");
document.write("Math.random() >>> "+Math.random()+"<br>");
document.write(`Random number between 0 and 10 (not including 10).<br>`);
document.write("Math.random() * 10 >>> "+Math.random() * 10+"<br>");
document.write("Math.random() * 10 >>> "+Math.random() * 10+"<br>");
document.write(`Random integer between 1 and 10<br>`);
document.write("Math.floor(Math.random() * 10) + 1 >>> ");
document.write(Math.floor(Math.random() * 10) + 1);
document.write("<br><br>");

function getRandomInt(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
}
document.write(`
function getRandomInt(min, max) {<br>
    return Math.floor(Math.random() * (max - min + 1)) + min;<br>
}<br>
getRandomInt(5, 15)<br>
`);
document.write(getRandomInt(5, 15)); // Random number between 5 and 15
document.write("<br><br>");


document.write(`The Math.abs() function returns the absolute value of a number (removes the negative sign if present).<br>
Math.abs(number)<br>`);
document.write("Math.abs(10) >>> "+Math.abs(10)+"<br>");  // 10
document.write("Math.abs(-10) >>> "+Math.abs(-10)+"<br>");  // 10
document.write("Math.abs(0) >>> "+Math.abs(0)+"<br>");  // 0
document.write("Math.abs(3.7) >>> "+Math.abs(3.7)+"<br>");  // 3.7
document.write("Math.abs(-Infinity) >>> "+Math.abs(-Infinity)+"<br>");  // Infinity
document.write("Math.abs(NaN) >>> "+Math.abs(NaN)+"<br>");  // NaN



</script>
