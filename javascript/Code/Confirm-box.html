<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm box</title>
    <style>body{ background-color: #000000; color: #fff; font-family: "arial"; font-size:14px; }</style>
</head>
<body>

    <script>

        //confirm("Are you agree ?")

        var a = confirm("Are you agree ?");
        //alert(a)
        // If yes it will show true and if click on cancel it will show false in alert box


        if(a){
            alert("Thanks") 
        }else{
            alert("Sorry")
        }
        // If yes it will show Thanks and if click on cancel it will show Sorry in alert box

        
    </script>
    
</body>
</html>
