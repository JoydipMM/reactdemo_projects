<body>
<h2>Array Sort & Reverse</h2>
<xmp style="margin-top: -25px;">
var sortArray = ["Sanjay", "Aman", "Raman", "Karan"];
document.write("Actual Array: "+sortArray+ "<br>");

sortArray.sort();
document.write("Sort Array: "+sortArray+ "<br>");

sortArray.reverse();
document.write("Reverse Array: "+sortArray+ "<br>");
</xmp>
<p>Result:</p>
<script>
var sortArray = ["Sanjay", "Aman", "Raman", "Karan"];
document.write("Actual Array: "+sortArray+ "<br>");

sortArray.sort();
document.write("Sort Array: "+sortArray+ "<br>");

sortArray.reverse();
document.write("Reverse Array: "+sortArray+ "<br>");
</script>
