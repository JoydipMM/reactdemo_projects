<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Method</title>
    <style>
    body{ background-color: #000000; color: #fff; font-family: "arial"; font-size:14px; }
    table, table th, table td{ border: 1px solid #fff; }
    table td{ padding: 10px; }
    </style>
</head>
<body>
<h2>Number Method</h2>
<p></p>
<xmp style="margin-top: -25px;">
</xmp>
<p>Result:</p>
<script>
var str = "99";
document.write("Actual String >>>> "+str+" and datatype: "+typeof(str)+"<br>")
document.write("The Number() function in JavaScript is used to convert a value into a number. <br>");
var num = Number(str);
document.write("Number(a) >>> "+num+" and datatype: "+typeof(num)+"<br><br>");

document.write("The parseInt() function converts a string into an integer (whole number). <br><br>");
var str2 = "75 88 77";
document.write("Actual String >>>> "+str2+" and datatype: "+typeof(str2)+"<br>")
var num = parseInt(str2);
document.write("parseInt(str2) >>> "+num+" and datatype: "+typeof(num)+"<br><br>");

var str3 = "45.78";
document.write("Actual String >>>> "+str3+" and datatype: "+typeof(str3)+"<br>")
var num3 = parseInt(str3);
document.write("parseInt(str3) >>> "+num3+" and datatype: "+typeof(num3)+"<br><br>");


document.write("The parseFloat() function converts a string into a floating-point (decimal) number. <br>");
var prdata = "45.78 percent";
document.write("Actual String >>>> '"+prdata+"' and datatype: "+typeof(prdata)+"<br>")
var prsflt = parseFloat(prdata);
document.write("parseInt(prsflt) >>> "+prsflt+" and datatype: "+typeof(prsflt)+"<br>");
var prdata2 = "60";
document.write("Actual String >>>> '"+prdata2+"' and datatype: "+typeof(prdata2)+"<br>")
var prsflt2 = parseFloat(prdata2);
document.write("parseInt(prsflt) >>> "+prsflt2+" and datatype: "+typeof(prsflt2)+"<br><br>");


document.write("isFinite() is a JavaScript function used to determine whether a given value is a finite number. It returns true if the value is a finite number and false otherwise.<br>");
var isfdata = 1;
document.write("Actual Data >>>> "+isfdata+"<br>")
var isfdataresulr = isFinite(isfdata);
document.write("isFinite(45) >>> "+isfdataresulr+"<br><br>");
var isfdataresulr = isFinite("Hello");
document.write("isFinite('Hello') >>> "+isfdataresulr+"<br><br>");

console.log(isFinite(100));       // true (100 is finite)
console.log(isFinite(-50.5));     // true (-50.5 is finite)
console.log(isFinite(0));         // true (0 is finite)

console.log(isFinite(Infinity));  // false
console.log(isFinite(-Infinity)); // false
console.log(isFinite(NaN));       // false

console.log(isFinite("123"));     // true (string "123" is converted to number 123)
console.log(isFinite("hello"));   // false (cannot be converted to a number)
console.log(isFinite(undefined)); // false
console.log(isFinite(null));      // true (null is converted to 0, which is finite)

document.write("The Number.isInteger() method in JavaScript determines whether a given value is an integer.<br>");
var isfdataresulr = Number.isInteger(10);
document.write("Number.isInteger(10) >>> "+isfdataresulr+"<br>");
var isfdataresulr = Number.isInteger("10");
document.write("Number.isInteger('10') >>> "+isfdataresulr+"<br><br>");

console.log(Number.isInteger(10));       // true (10 is an integer)
console.log(Number.isInteger(-5));       // true (-5 is an integer)
console.log(Number.isInteger(0));        // true (0 is an integer)

console.log(Number.isInteger(10.5));     // false (10.5 is not an integer)
console.log(Number.isInteger(Infinity)); // false (Infinity is not an integer)
console.log(Number.isInteger(NaN));      // false (NaN is not an integer)

console.log(Number.isInteger("10"));     // false (string, not a number)
console.log(Number.isInteger(true));     // false (boolean, not a number)
console.log(Number.isInteger(null));     // false (null is not an integer)


document.write("The toFixed() method in JavaScript formats a number to a specified number of decimal places and returns it as a string.<br>");
var num = 5.6789;
document.write("num.toFixed() >>> "+num+"<br>");
document.write("num.toFixed(2) >>> "+num+"<br>");
document.write("num.toFixed(4) >>> "+num+"<br>");
document.write("num.toFixed(6) >>> "+num+"<br>");
document.write("Number.isInteger('10') >>> "+isfdataresulr+"<br><br>");

console.log(num.toFixed());       // "6"  (rounds to nearest integer)
console.log(num.toFixed(2));      // "5.68"  (rounds to 2 decimal places)
console.log(num.toFixed(4));      // "5.6789"  (no rounding needed)
console.log(num.toFixed(6));      // "5.678900"  (pads with zeros)

let bigNum = 12345.6789;
document.write("Actual data >>> "+bigNum+"<br>");
console.log(bigNum.toFixed(1));   // "12345.7"
var bignemresult = bigNum.toFixed(1);
document.write("bigNum.toFixed(1) >>> "+bignemresult+"<br><br>");

let smallNum = 0.00012345;
document.write("Actual data >>> "+smallNum+"<br>");
var smnemresult = smallNum.toFixed(2);
console.log(smallNum.toFixed(2)); // "0.00"  (rounds down and pads)
document.write("smallNum.toFixed(2) >>> "+smnemresult+"<br><br>");


document.write("The toPrecision() method formats a number to a specified total number of significant digits and returns it as a string.<br>");
let psNum = 123.456;
document.write("Actual data >>> "+psNum+"<br>");
var psNumresult = psNum.toPrecision(2);
console.log(psNum.toPrecision(2)); // "0.00"  (rounds down and pads)
document.write("smallNum.toFixed(2) >>> "+psNumresult+"<br><br>");

var num = 123.456;

console.log(num.toPrecision(1)); // "1e+2"   (rounded to 1 significant digit)
console.log(num.toPrecision(2)); // "1.2e+2" (2 significant digits)
console.log(num.toPrecision(3)); // "123"    (3 significant digits, no decimal)
console.log(num.toPrecision(4)); // "123.5"  (rounded to 4 significant digits)
console.log(num.toPrecision(6)); // "123.456" (all digits preserved)
console.log(num.toPrecision(8)); // "123.45600" (adds trailing zeros)



</script>

<br><br>

</body>
</html>
