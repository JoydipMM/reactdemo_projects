<script>
//------------------------------- Arithmetic Operators ------------------------------------
/*
* = Multiplication
** = Exponentiation
/ = Division
% = Modulus / Remainder
++ = increment
-- = Decrement
*/
var a = 11;
var b = 5;
document.write("Modulus / Remainder: " + a % b);

document.write("<br><br>");

var c = 2;
var d = 3;
document.write("Exponentiation: " + c ** d);

document.write("<br><br>");
c++
document.write("c = 2, Increment: ", c);

document.write("<br><br>");
c--
document.write("Decrement: ", c);





    
</script>
    
</body>
