<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>:Assignment Operators:</title>
    <style>body{ background-color: #000000; color: #fff; }</style>
</head>
<body>


    <table class="ws-table-all notranslate">
        <tbody><tr>
        <th style="width:30%">Operator</th>
        <th>Example</th>
        <th>Same As</th>
        </tr>
        <tr>
        <td>=</td>
        <td>x = y</td>
        <td>x = y</td>
        </tr>
        <tr>
        <td>+=</td>
        <td>x += y</td>
        <td>x = x + y</td>
        </tr>
        <tr>
        <td>-=</td>
        <td>x -= y</td>
        <td>x = x - y</td>
        </tr>
        <tr>
        <td>*=</td>
        <td>x *= y</td>
        <td>x = x * y</td>
        </tr>
        <tr>
        <td>/=</td>
        <td>x /= y</td>
        <td>x = x / y</td>
        </tr>
        <tr>
        <td>%=</td>
        <td>x %= y</td>
        <td>x = x % y</td>
        </tr>
        <tr>
        <td>**=</td>
        <td>x **= y</td>
        <td>x = x ** y</td>
        </tr>
        </tbody></table>

<script>
//------------------------------- Assignment Operators ------------------------------------
/*

*/
document.write("<br><br>")
var a = 10;
var b = 3;
// a += b;

document.write(a += b) // result = 13
document.write("<br>")
document.write(a -= b) // result = 10
document.write("<br>")
document.write(a **= b) // result = 1000
document.write("<br>")
document.write(a %= b) // result = 1




    
</script>
    
</body>
</html>
