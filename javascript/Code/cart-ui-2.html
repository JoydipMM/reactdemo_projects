    { id:3, name: "Keyboard", price: 1500, inCart: false, stock: 6, initialStock: 6 },
    { id:4, name: "Monitor", price: 10000, inCart: false, stock: 9, initialStock: 9 },
    { id:5, name: "Speaker", price: 5000, inCart: false, stock: 12, initialStock: 12 },
]
const cartData = [];

const itemList = document.getElementById("item_list");
const cartList = document.getElementById("cart_list");

// render items process two ended


function renderItems(){
    itemList.innerHTML = "";
    itemsData.forEach((item)=>{
        itemList.innerHTML += `
        <div class="item-box">
            <h3>${item.name}</h3>
            <p>Instock: ${item.stock}</p>
            <p>Price: ${item.price}</p>
            <button 
                ${item.inCart ? "disabled" : ""} 
                onclick="addToCart(${item.id})">
                ${item.inCart ? "Added to Cart" : "Add to Cart"}
            </button>
        </div>`
    });
}

function renderCartList(){
    if(cartData.length === 0){
        cartList.innerHTML = "<h3>Cart is empty</h3>";
    }else{
        cartList.innerHTML = "";
        cartData.forEach((item)=>{
            cartList.innerHTML += `
            <div class="cart-item-box">
                <h3>${item.name}</h3>
                <button onclick="decreaseQty(${item.id})">-</button>
                <p>Qty: ${item.qty}</p>
                <button onclick="increaseQty(${item.id})">+</button>
                <p>Price: ${item.price}</p>
                <button onclick="removeFromCart(${item.id})">Remove</button>
            </div>`
        });
    }
}


function addToCart(id){
    const cartItem = itemsData.find((item) => item.id === id);
    const product = itemsData.find(item => item.id === id);
    product.inCart = true;
    product.stock -= 1;
    //console.log(cartItem);
    cartData.push({...cartItem, qty:1, inCart: true});
    renderCartList();
    renderItems();
}


function removeFromCart(id){
    //cartList.innerHTML = "";
    //console.log(cartData)
    const product = itemsData.find(item => item.id === id);
    const cartItem = cartData.find(item => item.id === id);

    product.inCart = false;
    product.stock = product.initialStock;

    const updateCartList = cartData.filter(item => item.id !== id);

    //console.log(updateCartList);
    cartData.length = 0;
    cartData.push(...updateCartList);

    renderCartList();
    renderItems();
    
}

function increaseQty(id){
    const updateCartList = cartData.find((item)=>item.id === id);
    const product = itemsData.find(item => item.id === id);

    if(product.stock === 0) return;

    updateCartList.qty += 1;
    product.stock -= 1;

    renderCartList();
    renderItems();
}

function decreaseQty(id){
    const updateCartList = cartData.find((item)=>item.id === id);
    const product = itemsData.find(item => item.id === id);

    updateCartList.qty -= 1;
    product.stock += 1;

    if(updateCartList.qty < 1){
        removeFromCart(id);
        return;
    }

    

    renderCartList();
    renderItems();
}

renderCartList();
renderItems();

</script>
