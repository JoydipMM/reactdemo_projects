<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fetch Data</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    img.show+img{
        display: none;
    }
  </style>
</head>

<body>
  <div class="container-fluid">
    <div class="w-full">
      <div class="row align-items-center justify-content-between">
        <div class="col-auto">
          <h1>Fetch Data using Javascript</h1>
        </div>
        <div class="col-auto">
          <button type="button" class="btn btn-primary" onclick="addUserModal()">Add New</button>
          <button type="button" class="btn btn-danger" onclick="fetchUser()">Refresh</button>
        </div>
      </div>
    </div>

    <b>Note: Pagination topic pending : https://www.youtube.com/watch?v=ZLXWdjBhSeI&list=PL0b6OzIxLPbx0ZTmVQgsB4T5KWXXxrZ6C&index=26</b>
    <form>
      <div class="mt-3 mb-3">
        <input type="text" id="searchUser" class="form-control" placeholder="Search user by name ...">
      </div>
    </form>


    <table class="table">
      <thead>
        <tr>
          <th scope="col">#</th>
          <th scope="col">Photo</th>
          <th scope="col">Useremail</th>
          <th scope="col">Phone</th>
          <th scope="col">Gender</th>
          <th scope="col">Action</th>
        </tr>
      </thead>
      <tbody id="userDataRow"></tbody>
    </table>
  </div>


  <div class="modal fade" id="userViewModal" tabindex="-1" aria-labelledby="userViewModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="userViewModalLabel">User Details</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div id="viewUserModalBody" class="modal-body">

        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <!-- <button type="button" class="btn btn-primary">Save changes</button> -->
        </div>
      </div>
    </div>
  </div>


  <div class="modal fade" id="userEditModal" tabindex="-1" aria-labelledby="userEditModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="userEditModalLabel">Edit User</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div id="editUserModalBody" class="modal-body">

        </div>
        <!-- <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary">Update</button>
            </div> -->
      </div>
    </div>
  </div>


  <div class="modal fade" id="userAddModal" tabindex="-1" aria-labelledby="userAddModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="userAddModalLabel">New User</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="addUserForm" enctype="multipart/form-data">
          <div class="modal-body">
            <div id="adderrormsg"></div>
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" name="useremail" class="form-control" value="">
            </div>
            <div class="mb-3">
              <label class="form-label">Phone</label>
              <input type="number" name="userphone" class="form-control" value="">
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" name="userpassword" class="form-control" value="">
            </div>
            <div class="mb-3">
              <label class="form-label">Gender</label>
              <select name="gender" class="form-control">
                <option value="Male">Male</option>
                <option value="Female">Female</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">Avater</label>
              <img id="avatarPreview" src="" alt="Avatar Preview" style="width: 80px; height: 80px; margin-top: 10px; display: none; border-radius: 5px; margin-bottom:15px">
              <input type="file" name="useravater" id="addAvaterInput" class="form-control" value="">
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>
  </div>



  <div id="loader" style="width: 100%; height: 100%; position: fixed; top: 0px; left: 0px; background: rgba(0,0,0,0.7); z-index: -1; opacity: 0; transition: all ease 0.3s; ">
    <div style="width: auto; height: auto; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: #fff; font-size: 40px;">Loading...</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // api url variable
    const baseURL = "http://localhost:3000";
    const userlistAPI = `${baseURL}/api/auth`;

    // common loading function
    function loading(isVisible = false) {
      const loader = document.querySelector("#loader");
      if (isVisible) {
        loader.style.display = "block";
        loader.style.zIndex = "9999";
        loader.style.opacity = "1";
      } else {
        setTimeout(() => {
          loader.style.display = "none";
          loader.style.zIndex = "-1";
          loader.style.opacity = "0";
        }, 500)
      }
    }
    
    // common avater function
    function avater(avater) {
      if (avater.useravater === "" || avater.useravater === undefined) {
        if (avater.gender === "Male") {
          const img = `<img src="../uploads/default/male-default-avater.png" width="70px" height="70px" />`
          return img;
        } else if (avater.gender === "Female") {
          const img = `<img src="../uploads/default/female-default-avater.png" width="70px" height="70px" />`
          return img;
        } else {
          return "asfasaf"
        }
      } else {
        const img = `<img src="${baseURL}/uploads/${avater.useravater}" width="70px" height="70px" />`
        return img;
      }
    }
    
    // common avater preview after image upload
    function previewAvater(avater, file, preview) {
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          preview.src = e.target.result;
          preview.style.display = "block";
          preview.classList.add("show")
        }
        reader.readAsDataURL(file);
      } else {
        preview.style.display = "none";
        preview.src = "";
        preview.classList.remove("show")
        avater(avater)
      }
    }

    // fetch all users
    async function fetchUser(search = '') {
      loading(true);
      const userTableSelector = document.querySelector("#userDataRow");
      userTableSelector.innerHTML = "";
      try {
        const res = await fetch(`${userlistAPI}?search=${encodeURIComponent(search)}`);

        if (!res) {
          throw new Error("API Error")
        }
        const data = await res.json();
        console.log(data);
        if (!data || data.length === 0) {
          userTableSelector.innerHTML = `<tr><td colspan="4" class="text-center">No data found</td></tr>`;
          loading(false);
          return
        }
        let srno = 1;
        data.forEach(user => {
          userTableSelector.innerHTML += `<tr>
                        <th scope="row">${srno++}</th>
                        <td style="display:none"><img src="${baseURL}/uploads/${user.useravater}" width="70px" height="70px" /></td>
                        <td>${avater(user)}</td>
                        <td>${user.useremail}</td>
                        <td>${user.userphone}</td>
                        <td>${user.gender}</td>
                        <td>
                            <button type="button" class="btn btn-primary" onclick="openViewModal('${user._id}')">View</button>
                            <button type="button" class="btn btn-warning" onclick="openEditModal('${user._id}')">Edit</button>
                            <button type="button" class="btn btn-danger" onclick="deleteUser('${user._id}')">Delete</button>
                        </td>
                    </tr>`
        });
        loading(false);


      } catch (error) {
        //console.log("Error: ",error);
        loading(false);
        userTableSelector.innerHTML = `<tr><td colspan="4" class="text-center text-danger">API not working</td></tr> `;
      }


    }

    fetchUser()



    // view modal
    async function openViewModal(id = null) {
      const modalBody = document.querySelector("#viewUserModalBody")
      const viewModal = document.querySelector("#userViewModal");
      const modal = new bootstrap.Modal(viewModal);
      modal.show();
      loading(true);
      try {
        const res = await fetch(`${userlistAPI}/${id}`);
        if (!res) {
          throw new Error("API Error")
        }
        const data = await res.json();
        //console.log(data); 
        if (!data || data.length === 0) {
          modalBody.innerHTML = `No data found`;
          loading(false);
          return
        }

        modalBody.innerHTML = `
                <ul class="list-group list-group-flush">
                    <li class="list-group-item">${avater(data)}</li>
                    <li class="list-group-item"><b>Email : </b>${data.useremail}</li>
                    <li class="list-group-item"><b>Phone : </b>${data.userphone}</li>
                    <li class="list-group-item"><b>Gender : </b>${data.gender}</li>
                </ul>
                `
        loading(false);

      } catch (error) {
        //console.log("Error: ",error);
        loading(false);
        userTableSelector.innerHTML = `API not working`;
      }
    }

    // edit modal
    async function openEditModal(id = null) {
      const modalBody = document.querySelector("#editUserModalBody")
      const viewModal = document.querySelector("#userEditModal");
      const modal = new bootstrap.Modal(viewModal);
      modal.show();
      loading(true);
      try {
        const res = await fetch(`${userlistAPI}/${id}`);
        if (!res) {
          throw new Error("API Error")
        }
        const data = await res.json();
        //console.log(data); 
        if (!data || data.length === 0) {
          modalBody.innerHTML = `No data found`;
          loading(false);
          return
        }


        modalBody.innerHTML = `
                <form id="editForm">
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" value="${data.useremail}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Phone</label>
                        <input type="number" name="userphone" class="form-control" value="${data.userphone}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" name="userpassword" class="form-control" value="${data.userpassword}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Gender</label>
                        <select name="gender" class="form-control">
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Avater<br/>
                            <img id="avatarPreview" src="" alt="Avatar Preview" style="width: 80px; height: 80px; margin-top: 10px; display: none; border-radius: 5px;">
                            ${avater(data)}
                            </label>
                        <input type="file" name="useravater" id="userAvatarInput" class="form-control mt-3" value="${data.useravater}">
                    </div>
                    
                    <button type="submit" class="btn btn-primary">Update</button>
                </form>
                `
        loading(false);

        document.querySelector("#userAvatarInput").addEventListener("change", function(event) {
        const file = event.target.files[0];
        const preview = document.querySelector("#avatarPreview");

        previewAvater(data.useravater, file, preview)
        });


        document.querySelector("#editForm").addEventListener("submit", async (e) => {
          e.preventDefault();
          loading(true);
          const formdata = new FormData(e.target);
          const res = await fetch(`${userlistAPI}/${id}`, {
            method: "PUT",
            body: formdata
          })
          if (res.ok) {
            fetchUser();
            loading(false);
            e.target.reset();
            const viewModal = document.querySelector("#userEditModal");
            const modal = bootstrap.Modal.getInstance(viewModal);
            modal.hide();
          } else {
            alert("Update failed");
            loading(false);
          }
        })

      } catch (error) {
        //console.log("Error: ",error);
        loading(false);
        userTableSelector.innerHTML = `API not working`;
      }
    }

    // add modal
    async function addUserModal() {
      const addModal = document.querySelector("#userAddModal");
      const modal = new bootstrap.Modal(addModal);
      modal.show();

      document.querySelector("#addAvaterInput").addEventListener("change", function(event) {
        const file = event.target.files[0];
        const preview = document.querySelector("#avatarPreview");

        previewAvater('',file, preview)
        });

    }

    // search
    document.querySelector("#searchUser").addEventListener("input", () => {
      fetchUser(document.querySelector("#searchUser").value)
    })

    // add user
    document.querySelector("#addUserForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const formdata = new FormData(e.target);
      const res = await fetch(userlistAPI, {
        method: "POST",
        body: formdata,
      })
      //console.log(res);
      if (res.ok) {
        e.target.reset();
        fetchUser();
        const viewModal = document.querySelector("#userAddModal");
        const modal = bootstrap.Modal.getInstance(viewModal);
        modal.hide();
      } else {
        console.log("error")
        document.querySelector("#adderrormsg").innerHTML = `<div class="alert alert-danger" role="alert">Error !!!</div>`
      }


    })



    // delete user
    async function deleteUser(id) {
      if (confirm("Are you sure to delete this user data?")) {
        //console.log("Delete User");
        const res = await fetch(`${userlistAPI}/${id}`, {
          method: "DELETE"
        })
        if (res.ok) {
          fetchUser();
        } else {
          alert("Unable to delete the user data !!!")
        }
      }
    }
  </script>



<!-- here we add our forntend code -->

</body>
</html>
