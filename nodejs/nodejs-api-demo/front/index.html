<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fetch Data</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>
    <h1>Fetch Data using Javascript</h1>

    <table class="table">
        <thead>
            <tr>
                <th scope="col">#</th>
                <th scope="col">Photo</th>
                <th scope="col">Useremail</th>
                <th scope="col">Action</th>
            </tr>
        </thead>
        <tbody id="userDataRow">

        </tbody>
    </table>



    <div class="modal fade" id="userView" tabindex="-1" aria-labelledby="userViewLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
            <div class="modal-header">
                <h1 class="modal-title fs-5" id="userViewLabel">Modal title</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                ...
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button type="button" class="btn btn-primary">Save changes</button>
            </div>
            </div>
        </div>
    </div>


    <script>
        const userlistAPI = "http://localhost:3000/api/auth";

        async function fetchUser(){
           const res = await fetch(`${userlistAPI}`);
           const data =  await res.json();
           console.log(data); 
           const userTableSelector = document.querySelector("#userDataRow");
           data.forEach(user => {
            userTableSelector.innerHTML+= `<tr>
                <th scope="row">1</th>
                <td><img src="http://localhost:3000/uploads/${user.useravater}" width="70px" height="70px" /></td>
                <td>${user.useremail}</td>
                <td>
                    <button type="button" class="btn btn-primary" onclick="viewUserPopup()">View</button>
                    <button type="button" class="btn btn-warning">Edit</button>
                    <button type="button" class="btn btn-danger">Delete</button>
                </td>
            </tr>`
           });
        }

        fetchUser()
    </script>




    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
